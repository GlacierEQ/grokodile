name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-quick-ci.yml@de58bce31d7099af7e89c8d8a3b6472356b0cec3
    with:
      repo_name: ${{ github.event.repository.name }}
      language: python
      strict: true
      verify_script: scripts/ci/verify.sh
      upload_artifacts: true

  grokodile-contract:
    name: Grokodile contract / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile bounded surfaces
        run: python -m compileall -q src tests
      - name: Run bounded mechanisms and truth tests
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_grokodile tests.test_public_truth
      - name: Run repository-owned proof
        run: bash scripts/ci/verify.sh
